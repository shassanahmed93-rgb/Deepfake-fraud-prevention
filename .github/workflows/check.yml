name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: node server/index.js & echo $! > /tmp/sentinel.pid
      - run: node scripts/smoke-check.mjs
      - if: always()
        run: kill $(cat /tmp/sentinel.pid) || true
